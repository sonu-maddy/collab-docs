# Render Blueprint: free web service from the Dockerfile. Database = free MongoDB Atlas cluster.
services:
  - type: web
    name: collab-docs
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URI
        sync: false          # paste your Atlas connection string in the Render dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: SEED_DEMO_DATA
        value: "true"
