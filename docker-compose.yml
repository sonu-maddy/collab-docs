services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/collab_docs
      JWT_SECRET: ${JWT_SECRET:-local-compose-secret-change-me}
      SEED_DEMO_DATA: "true"
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - server

volumes:
  mongo-data: